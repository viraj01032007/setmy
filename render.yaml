# Render Blueprint — creates the SetMyStay backend + its database in one click.
# Render dashboard → New → Blueprint → pick this repo → Apply.
databases:
  - name: setmystay-db
    plan: free            # free Render databases expire after 30 days; switch to a paid plan for the client
    region: singapore
    databaseName: setmystay
    user: setmystay

services:
  - type: web
    name: setmystay-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn setmystay_backend.wsgi:application
    healthCheckPath: /api/site-settings/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: setmystay-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: RAZORPAY_KEY_ID
        sync: false        # Render asks you to paste this when you apply the Blueprint
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false        # from cloudinary.com → Dashboard → "API environment variable" (keeps photos after restarts)
      - key: PUBLIC_BACKEND_URL
        value: https://setmystay-api.onrender.com   # change if Render gives the service a different address
